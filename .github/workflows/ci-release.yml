name: Continuous Integration and Release

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "**/docs/**"
      - "**/.github/**"
  pull_request:
    branches: [main, develop]

jobs:
  skip-ci-check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Determine if CI should be skipped
        id: skip_check
        run: |
          echo "=== CI Skip Check Debug ==="
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Type: ${{ github.ref_type }}"
          
          # RULE 1: NEVER SKIP CI FOR TAGS
          if [[ "${{ github.ref_type }}" == "tag" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "🏷️  TAG DETECTED - NEVER SKIPPING CI FOR RELEASES"
            echo "Tag: ${{ github.ref }}"
            echo "should_skip=false" >> $GITHUB_OUTPUT
            echo "✅ Proceeding with CI for tag release"
            exit 0
          fi
          
          # RULE 2: For non-tag events, check skip patterns
          echo "Checking skip patterns for non-tag event..."
          
          COMMIT_MSG="${{ github.event.head_commit.message || '' }}"
          PR_TITLE="${{ github.event.pull_request.title || '' }}"
          
          echo "Commit message: '$COMMIT_MSG'"
          echo "PR title: '$PR_TITLE'"
          
          should_skip=false
          
          # Check for skip patterns in current commit/PR only
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]] || 
             [[ "$COMMIT_MSG" == *"[ci skip]"* ]] || 
             [[ "$COMMIT_MSG" == *"[skip actions]"* ]] || 
             [[ "$COMMIT_MSG" == *"[actions skip]"* ]] ||
             [[ "$PR_TITLE" == *"[skip ci]"* ]] || 
             [[ "$PR_TITLE" == *"[ci skip]"* ]] || 
             [[ "$PR_TITLE" == *"[skip actions]"* ]] || 
             [[ "$PR_TITLE" == *"[actions skip]"* ]]; then
            should_skip=true
            echo "⏭️  Skip pattern found in current commit/PR"
          fi
          
          echo "should_skip=$should_skip" >> $GITHUB_OUTPUT
          
          if [ "$should_skip" = true ]; then
            echo "⏭️  Skipping CI due to skip pattern in current event"
          else
            echo "✅ Proceeding with CI"
          fi

  # Comprehensive testing across Node versions
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: skip-ci-check
    if: needs.skip-ci-check.outputs.should_skip == 'false'
    strategy:
      matrix:
        #        node-version: [16.x, 18.x, 20.x]
        node-version: [20.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter and auto-fix
        run: |
          echo "🔧 Auto-fixing linting issues..."
          npm run lint:fix

          echo "📋 Checking for remaining linting issues..."
          if npm run lint; then
            echo "✅ All linting issues resolved"
          else
            echo "⚠️  Some linting issues require manual attention"
            echo "Run 'npm run lint' to see details. Continuing workflow..."
          fi

      - name: Check and auto-fix formatting
        run: |
          echo "Running auto-formatter..."
          npm run format

          echo "Verifying formatting..."
          if npm run format-check; then
            echo "✅ Formatting is correct"
          else
            echo "⚠️  Some formatting issues remain after auto-fix"
            npm run format-check 2>&1 | grep -E "(error|Warning)" | head -5 || true
            echo "Continuing workflow..."
          fi

      - name: Build project
        run: npm run package

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: kodelint/blogs-publisher

  # Build and package for distribution
  build-and-package:
    runs-on: ubuntu-latest
    needs:
      - skip-ci-check
      - test
    if: needs.skip-ci-check.outputs.should_skip == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Integration test for PRs
  integration-test:
    runs-on: ubuntu-latest
    needs:
      - skip-ci-check
      - build-and-package
    if: |
      needs.skip-ci-check.outputs.should_skip == 'false' &&
      github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Test action (dry run)
        uses: ./
        with:
          medium_token: "test-token"
          devto_token: "test-token"
          hashnode_token: "test-token"
          dry_run: "true"
          github_token: 'test_token'

  # Security checks
  security-check:
    runs-on: ubuntu-latest
    needs: skip-ci-check
    if: needs.skip-ci-check.outputs.should_skip == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit (continue on)
        run: |
          npm audit --audit-level=high || \
            if [ $? -eq 1 ]; then
              echo "High or critical severity vulnerabilities found!, continuing..."
            else
              echo "Audit completed with fixable issues, continuing..."
            fi

  # Quality metrics
  quality-metrics:
    runs-on: ubuntu-latest
    needs:
      - skip-ci-check
      - test
    if: needs.skip-ci-check.outputs.should_skip == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate gzipped bundle for size check
        run: |
          if [ -f "dist/index.js" ]; then
            echo "Creating gzipped version for size check..."
            gzip -c dist/index.js > dist/index.js.gz
            echo "✅ Created dist/index.js.gz"
            echo "File sizes:"
            ls -lh dist/
          else
            echo "❌ dist/index.js not found - cannot check bundle size, continuing..."
          fi

      - name: Check bundle size
        run: npm run size

      - name: Check dependencies
        run: |
          npm run deps:check || \
            if [ $? -eq 1 ]; then
              echo "❌ Outdated packages found! Run 'npm run deps:check' to identify and upgrade"
              echo "Continuing..."
            else
              echo "✅ No outdated packages found!"
            fi

      - name: Run Snyk security scan
        run: |
          npm run vulnerabilities:check || \
            if [ $? -eq 1 ]; then
              echo "❌ High or critical severity vulnerabilities found using external service!, continuing..."
            else
              echo "✅ Audit completed with fixable issues, continuing..."
            fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    needs: skip-ci-check
    if: needs.skip-ci-check.outputs.should_skip == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code complexity
        run: npx complexity-report --maxcc 10 --ignorePattern ".*test.*|.*spec.*" src/

      - name: Check for TypeScript errors
        run: npx tsc --noEmit --strict

      - name: Check for dead code
        run: npx ts-prune --ignore "test|spec|__tests__|__mocks__"

  # GitHub-only Semantic Release (no npm)
  semantic-release:
    name: Semantic Release (GitHub Only)
    runs-on: ubuntu-latest
    needs:
      - skip-ci-check
      - test
      - security-check
      - quality-metrics
    if: |
      needs.skip-ci-check.outputs.should_skip == 'false' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run package

      - name: Run Semantic Release (GitHub only)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          NPM_CONFIG_FUND: false
          NPM_CONFIG_AUDIT: false
        run: |
          echo "Running semantic-release for GitHub-only release..."
          echo "NPM publishing is disabled via configuration"
          npx semantic-release --no-ci

  # Release to GitHub Marketplace
  release-to-marketplace:
    name: Release to GitHub Marketplace
    runs-on: ubuntu-latest
    needs:
      - semantic-release
    if: |
      needs.semantic-release.outputs.new-release-published == 'true' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}

      - name: Get new version
        id: get_version
        run: |
          NEW_VERSION="${{ needs.semantic-release.outputs.new-release-version }}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Get Release Notes from Changelog
        id: get_notes
        run: |
          # Extract the latest release notes from the CHANGELOG.md
          CHANGELOG_CONTENT=$(<CHANGELOG.md)
          LATEST_RELEASE_NOTES=$(echo "$CHANGELOG_CONTENT" | awk '/^## \[/ {p=0} /^## \[${{ steps.get_version.outputs.NEW_VERSION }}/ {p=1; next} p' | sed '/^## \[/Q')
          
          # Clean up any leading/trailing whitespace
          LATEST_RELEASE_NOTES=$(echo "$LATEST_RELEASE_NOTES" | xargs)
          
          # Handle case where notes are not found
          if [ -z "$LATEST_RELEASE_NOTES" ]; then
            echo "::warning::Could not find release notes for version ${{ steps.get_version.outputs.NEW_VERSION }} in CHANGELOG.md."
            LATEST_RELEASE_NOTES="No release notes available."
          fi
          
          # Set as output
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$LATEST_RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.get_version.outputs.NEW_VERSION }}"
          name: Release v${{ steps.get_version.outputs.NEW_VERSION }}
          draft: false
          prerelease: false
          body: |
            ## Changes in ${{ steps.get_version.outputs.NEW_VERSION }}
            ${{ steps.get_notes.outputs.release_notes }}
          files: |
            dist/**
            action.yml
            README.md
            CHANGELOG.md

      - name: Update Major Version Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          NEW_VERSION="${{ steps.get_version.outputs.NEW_VERSION }}"
          MAJOR=$(echo $NEW_VERSION | cut -d. -f1)
          
          echo "Creating/updating major version tag v$MAJOR for version $NEW_VERSION"
          
          git tag -fa "v$MAJOR" -m "Update v$MAJOR to point to v$NEW_VERSION"
          git push origin "v$MAJOR" --force