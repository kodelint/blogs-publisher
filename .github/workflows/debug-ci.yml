name: Debug CI Tag Issues

# This workflow should trigger on ANY tag push
on:
  push:
    tags: ["**"]  # Matches any tag
  workflow_dispatch:
    inputs:
      debug_level:
        description: 'Debug level'
        required: false
        default: 'basic'

jobs:
  debug-basic-info:
    runs-on: ubuntu-latest
    steps:
      - name: Debug - Basic Info
        run: |
          echo "=== BASIC DEBUG INFO ==="
          echo "Workflow triggered by: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor (who triggered): ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref type: ${{ github.ref_type }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          
      - name: Debug - Event Details
        run: |
          echo "=== EVENT DETAILS ==="
          echo "Event name: ${{ github.event_name }}"
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "This is a PUSH event"
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              echo "✅ This is a TAG PUSH!"
              echo "Tag name: ${{ github.ref_name }}"
            else
              echo "This is a branch push"
              echo "Branch: ${{ github.ref_name }}"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "This is a MANUAL trigger"
          else
            echo "This is some other event: ${{ github.event_name }}"
          fi
          
      - name: Debug - Full Event Payload
        run: |
          echo "=== FULL EVENT PAYLOAD ==="
          echo '${{ toJSON(github.event) }}'

  check-workflow-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Check workflow file location and syntax
        run: |
          echo "=== CHECKING WORKFLOW FILES ==="
          
          # Check if .github/workflows directory exists
          if [ -d ".github/workflows" ]; then
            echo "✅ .github/workflows directory exists"
            echo "Workflow files found:"
            find .github/workflows -name "*.yml" -o -name "*.yaml" | while read file; do
              echo "  - $file"
            done
          else
            echo "❌ .github/workflows directory NOT found!"
          fi
          
          # Check current workflow file
          WORKFLOW_FILE=".github/workflows/ci.yml"  # Adjust this to your actual filename
          if [ -f "$WORKFLOW_FILE" ]; then
            echo "✅ Main workflow file exists: $WORKFLOW_FILE"
            echo "=== WORKFLOW CONTENT (first 50 lines) ==="
            head -50 "$WORKFLOW_FILE"
          else
            echo "❌ Main workflow file NOT found: $WORKFLOW_FILE"
            echo "Available workflow files:"
            ls -la .github/workflows/ || echo "No workflows directory or files"
          fi

  test-tag-detection:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Tag workflow triggered successfully
        run: |
          echo "🎉 SUCCESS: This job only runs for tags and it's running!"
          echo "Tag: ${{ github.ref_name }}"
          echo "Full ref: ${{ github.ref }}"
