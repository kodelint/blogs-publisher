name: "Blogs Publisher"
description: "Publish Markdown blogs to Medium, Dev.to, and Hashnode"
author: "kodelint"
inputs:
  medium-token:
    description: "Medium Integration Token"
    required: false
  devto-token:
    description: "Dev.to API Key"
    required: false
  hashnode-token:
    description: "Hashnode Personal Access Token"
    required: false
  github-token:
    description: 'GitHub token for accessing repository contents'
    required: true
  hashnode-publication-id:
    description: "Hashnode Publication ID (optional)"
    required: false
  medium-path:
    description: "Path pattern for Medium posts"
    required: false
    default: "posts/medium"
  devto_path:
    description: "Path pattern for Dev.to posts"
    required: false
    default: "posts/devto"
  hashnode_path:
    description: "Path pattern for Hashnode posts"
    required: false
    default: "posts/hashnode"
  use_commit_message:
    description: "Use commit message to determine platform (true/false)"
    required: false
    default: "false"
  dry_run:
    description: "Run in dry_run mode without publishing"
    required: false
    default: "false"
  posts_directory:
    description: "Base directory for posts"
    required: false
    default: "."
  update_already_published:
    description: 'Update posts that were already published'
    default: 'true'
    required: false
  debugging_enabled:
    description: 'Enable debug logging'
    default: 'false'
    required: false
outputs:
  published-posts:
    description: "JSON array of successfully published posts"
  failed-posts:
    description: "JSON array of posts that failed to publish"
runs:
  using: "node20"
  main: "dist/index.js"
branding:
  icon: "edit-3"
  color: "blue"
